# Reference locations for an existing HTTPS server block on the Docker host.
# Replace 14000/13107 with the approved DEMO_GATEWAY_HOST_PORT and
# DEMO_BRIDGE_HOST_PORT. Do not include this file without IT review.

location ^~ /api/v1/assistant/ {
    proxy_pass http://127.0.0.1:14000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /assistant-identity/identity/exchange {
    proxy_pass http://127.0.0.1:13107/identity/exchange;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}

# Publish only when the approved Bridge JWKS URI uses this hostname/path.
# Verify no conflict with the existing website's own .well-known routes.
location = /.well-known/jwks.json {
    proxy_pass http://127.0.0.1:13107/.well-known/jwks.json;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
}
