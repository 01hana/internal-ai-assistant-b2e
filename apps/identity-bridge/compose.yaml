name: feature007-local-rehearsal

services:
  identity-bridge:
    image: internal-ai-assistant-identity-bridge:local
    build:
      context: ../..
      dockerfile: apps/identity-bridge/Dockerfile
    env_file:
      - path: env/local.env.example
      - path: env/local.env
        required: false
      - path: ../../.local-secrets/identity-bridge/bridge-signing.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      NODE_EXTRA_CA_CERTS: /run/secrets/local-ca.crt
    secrets:
      - source: identity_bridge_private_key
        target: identity-bridge-private-key.pem
      - source: local_ca_certificate
        target: local-ca.crt
    ports:
      - "127.0.0.1:${IDENTITY_BRIDGE_LOCAL_PORT:-3107}:3000"
    networks:
      rehearsal:
        ipv4_address: 172.30.70.20
    depends_on:
      idx-https-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  idx-https-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./deploy/idx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - source: idx_proxy_certificate
        target: idx-proxy.local.crt
      - source: idx_proxy_private_key
        target: idx-proxy.local.key
    networks:
      rehearsal:
        aliases: [idx-proxy.local]
        ipv4_address: 172.30.70.10
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /var/cache/nginx:size=16m,nosuid,nodev
      - /var/run:size=1m,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

networks:
  rehearsal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.70.0/24

secrets:
  identity_bridge_private_key:
    file: ../../.local-secrets/identity-bridge/bridge-private-key.pem
  local_ca_certificate:
    file: ../../.local-secrets/identity-bridge/tls/local-ca.crt
  idx_proxy_certificate:
    file: ../../.local-secrets/identity-bridge/tls/idx-proxy.local.crt
  idx_proxy_private_key:
    file: ../../.local-secrets/identity-bridge/tls/idx-proxy.local.key
