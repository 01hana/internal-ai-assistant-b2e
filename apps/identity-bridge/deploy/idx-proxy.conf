server {
    listen 8443 ssl;
    server_name idx-proxy.local;

    ssl_certificate /run/secrets/idx-proxy.local.crt;
    ssl_certificate_key /run/secrets/idx-proxy.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 1k;

    location = /_local/tls-probe {
        default_type application/json;
        return 200 '{}';
    }

    location = /APIs/Auth/APIs/Site/MenuDetail {
        limit_except GET { deny all; }
        proxy_pass http://59.125.138.139/APIs/Auth/APIs/Site/MenuDetail;
        proxy_method GET;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Host 59.125.138.139;
        proxy_pass_request_body off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    location / { return 404; }
}
