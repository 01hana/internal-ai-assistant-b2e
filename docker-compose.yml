services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_RUNTIME_DEBUG: ${ENABLE_RUNTIME_DEBUG:-false}
      ENABLE_REDIS: ${ENABLE_REDIS:-false}
      ENABLE_SWAGGER_DOCS: ${ENABLE_SWAGGER_DOCS:-false}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}
      INTERNAL_IDENTITY_JWT_ISSUER: ${INTERNAL_IDENTITY_JWT_ISSUER}
      INTERNAL_IDENTITY_JWT_AUDIENCE: ${INTERNAL_IDENTITY_JWT_AUDIENCE}
      INTERNAL_IDENTITY_JWKS_URI: ${INTERNAL_IDENTITY_JWKS_URI}
      INTERNAL_IDENTITY_JWT_CLOCK_TOLERANCE_SECONDS: ${INTERNAL_IDENTITY_JWT_CLOCK_TOLERANCE_SECONDS:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      GATEWAY_PORT: ${GATEWAY_PORT:-4000}
      GATEWAY_EXTERNAL_JWT_ISSUER: ${GATEWAY_EXTERNAL_JWT_ISSUER}
      GATEWAY_EXTERNAL_JWT_AUDIENCE: ${GATEWAY_EXTERNAL_JWT_AUDIENCE}
      GATEWAY_EXTERNAL_JWKS_URI: ${GATEWAY_EXTERNAL_JWKS_URI}
      GATEWAY_INTERNAL_JWT_ISSUER: ${GATEWAY_INTERNAL_JWT_ISSUER:-http://gateway:4000}
      GATEWAY_INTERNAL_JWT_AUDIENCE: ${GATEWAY_INTERNAL_JWT_AUDIENCE:-internal-ai-assistant}
      GATEWAY_INTERNAL_JWT_KEY_ID: ${GATEWAY_INTERNAL_JWT_KEY_ID}
      GATEWAY_INTERNAL_JWT_PRIVATE_KEY_BASE64: ${GATEWAY_INTERNAL_JWT_PRIVATE_KEY_BASE64}
      GATEWAY_INTERNAL_JWT_TTL_SECONDS: ${GATEWAY_INTERNAL_JWT_TTL_SECONDS:-300}
      GATEWAY_BACKEND_001_BASE_URL: ${GATEWAY_BACKEND_001_BASE_URL:-http://app:3000}
      GATEWAY_CLIENT_REGISTRY_JSON: ${GATEWAY_CLIENT_REGISTRY_JSON}
    ports:
      - "4000:4000"
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    ports:
      - "6379:6379"

volumes:
  postgres-data:
